<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Family Vault</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="card">
    <h1>🔐 Create Account</h1>
    <p>Join your family vault.</p>

    <form id="registerForm">
      <input type="text" id="fullName" placeholder="Full name" required>
      <input type="email" id="email" placeholder="Email address" required>
      <input type="password" id="password" placeholder="Password (min 6 characters)" required>
      <input type="password" id="confirmPassword" placeholder="Confirm password" required>
      <button type="submit">Register</button>
    </form>

    <p id="message"></p>
    <p class="small">Already have an account? <a href="login.html">Login</a></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
